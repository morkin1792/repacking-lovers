[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repacking-lovers"
version = "0.1.0.dev0"
description = "Android repackaging experiments for authorized testing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repack = "repack.cli:main"

[tool.setuptools]
packages = ["repack"]

[tool.setuptools.package-data]
repack = ["web/*.html", "web/*.css", "web/*.js"]
